model_name: run48_telugu_25m_swiglu_ctx512_bs16_lr3e-04

language: Telugu

tokenizer:
  type: BPE
  vocab_size: 12500
  tokenizer_path: tokenizer_runs/bpe_vocab_12500/tokenizer.json
  vocab_path: tokenizer_runs/bpe_vocab_12500/vocab.json

model:
  # ~25M parameter architecture
  d_model: 640
  num_layers: 4
  num_heads: 8

  # SwiGLU FFN
  ffn_dim: 1365

  context_length: 512

  # Regularization
  dropout: 0.05

  # Positional encoding
  positional_encoding: rope
  rope_theta: 10000.0

  # Transformer architecture
  normalization: pre_norm
  activation: SwiGLU

  # Shared input/output embedding
  tie_embeddings: true

  # Initialization
  init_std: 0.02

training:
  # Physical batch
  batch_size: 16

  # Effective batch = 16 x 4 = 64 sequences
  gradient_accumulation_steps: 4

  optimizer: AdamW

  # Recommended starting LR for this 25M model
  learning_rate: 0.0003
  min_learning_rate: 0.00003

  weight_decay: 0.1

  beta1: 0.9
  beta2: 0.95
  epsilon: 1.0e-08

  scheduler: cosine

  # ~5% of 16k steps
  warmup_steps: 750

  # 500M training tokens
  target_tokens: 500000000

  # 16 x 4 x 512 = 32,768 tokens/optimizer step
  # 500M / 32,768 ~= 15,259 steps
  max_steps: 16000

  max_grad_norm: 1.0

  eval_batches: 20
  eval_interval: 1000
  checkpoint_interval: 1000

  seed: 42

data:
  train_path: data/final_data_set/train.txt
  validation_path: data/final_data_set/val.txt
  test_path: data/final_data_set/test.txt

  shard_dir: token_shards

  val_bin: token_shards/val.bin
  test_bin: token_shards/test.bin

  context_length: 512

  num_workers: 2
  pin_memory: true

checkpoint:
  output_dir: checkpoints

  resume_from: null

  save_optimizer: true
  save_scheduler: true
  save_config: true

evaluation:
  eval_batch_size: 16

  temperatures:
    - 0.5
    - 1.0
    - 1.5

  max_generation_length: 256

logging:
  log_dir: logs

  log_interval: 100

  save_loss_curve: true

  train_log_filename: train_log.jsonl
  checkpoint_log_filename: checkpoint_analysis.txt
  loss_curve_filename: loss_curve.png

  loss_curve_title: "Training Loss Curve — 25M Telugu SwiGLU Model"

hardware:
  device: cuda
  mixed_precision: true