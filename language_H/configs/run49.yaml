model_name: run49_wide_swiglu_ctx512_bs16_lr1e-03_vocab7500
language: Telugu
tokenizer:
  type: BPE
  vocab_size: 12500                # was 12500 — frees ~3.2M params from the embedding table
  tokenizer_path: tokenizer_runs/bpe_vocab_7500/tokenizer.json
  vocab_path: tokenizer_runs/bpe_vocab_7500/vocab.json
model:
  d_model: 640
  num_layers: 4
  num_heads: 8
  ffn_dim: 1781                    # was 1365 — reinvests the freed budget; ~8/3*d_model SwiGLU ratio
  context_length: 512
  dropout: 0.1
  positional_encoding: rope
  rope_theta: 10000.0
  normalization: pre_norm
  activation: SWIGLU
  tie_embeddings: true
  init_std: 0.02
training:
  batch_size: 16
  gradient_accumulation_steps: 4
  optimizer: AdamW
  learning_rate: 0.001
  min_learning_rate: 0.0001
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  epsilon: 1.0e-08
  scheduler: cosine
  warmup_steps: 2000
  target_tokens: 500000000   # NOTE: informational only — not read by train.py
  num_epochs: 3               # NEW — drives the stop condition; overrides max_steps below
  max_steps: 100000           # kept as a fallback; ignored/overwritten when num_epochs is set
  max_grad_norm: 1.0
  eval_batches: 20
  eval_interval: 1000
  checkpoint_interval: 1000
  seed: 42
data:
  train_path: data/final_data_set/train.txt
  validation_path: data/final_data_set/val.txt
  test_path: data/final_data_set/test.txt
  shard_dir: token_shards
  val_bin: token_shards/val.bin
  test_bin: token_shards/test.bin
  context_length: 512
  num_workers: 2
  pin_memory: true
checkpoint:
  output_dir: checkpoints
  resume_from: null
  save_optimizer: true
  save_scheduler: true
  save_config: true
evaluation:
  eval_batch_size: 16
  temperatures:
    - 0.5
    - 1.0
    - 1.5
  max_generation_length: 256
logging:
  log_dir: logs
  log_interval: 100
  save_loss_curve: true
  train_log_filename: train_log.jsonl
  checkpoint_log_filename: checkpoint_analysis.txt
  loss_curve_filename: loss_curve.png
  loss_curve_title: "Training Loss Curve \u2014 Model H (Telugu)"
hardware:
  device: cuda
  mixed_precision: true